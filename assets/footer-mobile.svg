<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130" viewBox="0 0 600 130" role="img" aria-label="Thanks for stopping by"><title>Thanks for stopping by</title><style>.w{animation:drift 8s linear infinite}@keyframes drift{to{transform:translateX(-300px)}}.thD{display:none}@media (prefers-color-scheme: dark){.thL{display:none}.thD{display:inline}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="thL"><defs>
