    </pattern></defs>
    <g class="w"><path d="M0 104 q75 -26 150 0 t150 0 q75 -26 150 0 t150 0 q75 -26 150 0 t150 0 q75 -26 150 0 t150 0 q75 -26 150 0 t150 0 q75 -26 150 0 t150 0" fill="none" stroke="url(#brand-d)" stroke-width="2.5" opacity=".6"/></g>
