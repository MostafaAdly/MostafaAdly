    <text x="300" y="56" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" fill="#1f2328">شكراً للزيارة · thanks for stopping by</text></g><g class="thD"><defs>
