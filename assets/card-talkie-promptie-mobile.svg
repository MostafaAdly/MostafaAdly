<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="Kalam: Mac dictation in Arabic and English, even mid-sentence. Optional Claude prompts."><title>Kalam: Mac dictation in Arabic and English, even mid-sentence. Optional Claude prompts.</title><style>.thD{display:none}@media (prefers-color-scheme: dark){.thL{display:none}.thD{display:inline}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="thL"><defs>
