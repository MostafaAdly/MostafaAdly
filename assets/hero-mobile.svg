<svg xmlns="http://www.w3.org/2000/svg" width="600" height="744" viewBox="0 0 600 744" role="img" aria-label="Mostafa Adly, software engineer at Vast Group in Cairo. I ship restaurant ordering and payments, the tooling that releases them, and AI agents that do real work."><title>Mostafa Adly, software engineer at Vast Group in Cairo. I ship restaurant ordering and payments, the tooling that releases them, and AI agents that do real work.</title><style>
    .ph{opacity:0;animation:ph 9s infinite} .ph0{opacity:1}
    .ph1{animation-delay:3.0s} .ph2{animation-delay:6.0s}
    @keyframes ph{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:none}33%,100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes l0{0%,4.0%{opacity:0}5.5%,94%{opacity:1}100%{opacity:0}}.l0{animation:l0 15.0s infinite}@keyframes l1{0%,10.0%{opacity:0}11.5%,94%{opacity:1}100%{opacity:0}}.l1{animation:l1 15.0s infinite}@keyframes l2{0%,16.0%{opacity:0}17.5%,94%{opacity:1}100%{opacity:0}}.l2{animation:l2 15.0s infinite}@keyframes l3{0%,22.0%{opacity:0}23.5%,94%{opacity:1}100%{opacity:0}}.l3{animation:l3 15.0s infinite}@keyframes l4{0%,28.0%{opacity:0}29.5%,94%{opacity:1}100%{opacity:0}}.l4{animation:l4 15.0s infinite}@keyframes l5{0%,34.0%{opacity:0}35.5%,94%{opacity:1}100%{opacity:0}}.l5{animation:l5 15.0s infinite}@keyframes l6{0%,40.0%{opacity:0}41.5%,94%{opacity:1}100%{opacity:0}}.l6{animation:l6 15.0s infinite}@keyframes l7{0%,46.0%{opacity:0}47.5%,94%{opacity:1}100%{opacity:0}}.l7{animation:l7 15.0s infinite}.thD{display:none}@media (prefers-color-scheme: dark){.thL{display:none}.thD{display:inline}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="thL"><defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
