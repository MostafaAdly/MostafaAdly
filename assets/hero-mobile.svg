      <stop offset="1" stop-color="#7048e8" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="599" height="743" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x=".5" y=".5" width="599" height="743" rx="12" fill="url(#dots)"/>
    <circle cx="108" cy="70" r="330" fill="url(#glowA)"/>
