      <text x="32" y="246" font-size="25" fill="#1f2328">I ship restaurant ordering and</text><text x="32" y="280" font-size="25" fill="#1f2328">payments, the tooling that releases</text><text x="32" y="314" font-size="25" fill="#1f2328">them, and AI agents that do real work.</text>
